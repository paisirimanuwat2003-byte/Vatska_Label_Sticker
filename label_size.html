<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Label Layout</title>
    <style>
        @page {
            size: 85mm 50mm;
            /* Set the exact physical PDF size here */
            margin: 0;
            /* Remove default page margins */
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 2mm;
            /* Use padding inside the body instead of page margins */
        }

        /* The main outer border matching the image */
        .label-container {
            padding-left: 5mm;
            /* Add some padding to the left for better alignment */
            width: 85mm;
            /* Adjust width as needed */
            height: 50mm;
            /* Adjust height as needed */
            box-sizing: border-box;
            position: relative;
        }

        /* The top header text */
        .header-text {
            font-size: 10pt;
            letter-spacing: 4px;
            /* Matches the spaced-out 'a s d f v d' look */
            margin-bottom: 10px;
            font-weight: normal;
        }

        /* Table used for perfect vertical alignment of the labels and values */
        .data-table {
            padding-left: 5mm;
            /* Add some padding to the left for better alignment */
            width: 85mm;
            /* Full width of the label */
            border-collapse: collapse;
            font-size: 9pt;
            margin-bottom: 10px;
        }

        .data-table td {
            vertical-align: top;
        }


        /* Set a fixed width for the left column so the right column aligns perfectly */
        .label-col {
            width: 25mm;
            /* Adjust width as needed */
        }

        /* The barcode placeholder box with the "X" drawn using CSS gradients */
        .barcode-placeholder {
            padding-left: 2mm;
            /* Add some padding to the left for better alignment */
            align-items: center;
            width: 60mm;
            /* Adjust width as needed */
            height: 11mm;
            /* Adjust height as needed */
            position: absolute;
            bottom: 2mm;
            /* Position it at the bottom of the label */
        }
    </style>
</head>

<body>

    <div class="label-container">
        <!-- Header Text -->
        <div class="header-text">
            <img src="./icons/electrolux.jpg" style="width :21mm">
        </div>
        <!-- Data Grid -->
        <table class="data-table">
            <tr>
                <td class="label-col">Product code:</td>
                <td>{product_code}</td>
            </tr>
            <tr>
                <td class="label-col">Product Desc:</td>
                <td>{product_desc}</td>
            </tr>
            <tr>
                <td class="label-col">Lot No.:</td>
                <td>{lot_no}</td>
            </tr>
            <tr>
                <td class="label-col">Quantity:</td>
                <td>{qty}</td>
            </tr>
            <tr>
                <td class="label-col">Date of Mfg:</td>
                <td>{date_mfg}</td>
            </tr>
            <tr>
                <td class="label-col">PO No.:</td>
                <td>{po_no}</td>
            </tr>
        </table>

        <!-- Placeholder Box -->
        <div class="barcode-placeholder">
            <img src="D:\vatska\software\barcode_cache\electrolux_barcode.png"
                style="width: 100%; height: 100%; object-fit: contain;">
        </div>
    </div>
</body>

</html>
